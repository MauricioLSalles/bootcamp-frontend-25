<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="card.css" />
    <link href="card.html" rel="import" />
    <title>Cards</title>
  </head>
  <body>
    <section class="col-1 grid-1-2">
      <section class="col-1 row-1 grid-2-3">
        <div class="card col-1 row-3">
          <div class="card-yugi">
            <div class="title">
              <p>Dark Magician</p>
              <img
                src="https://images.ygoprodeck.com/images/cards/DARK.jpg"
                alt="x"
              />
            </div>
            <div class="stars">
              <img
                src="https://ygoprodeck.com/wp-content/uploads/2017/01/level.png"
                alt="x"
              />
              <img
                src="https://ygoprodeck.com/wp-content/uploads/2017/01/level.png"
                alt="x"
              />
              <img
                src="https://ygoprodeck.com/wp-content/uploads/2017/01/level.png"
                alt="x"
              />
              <img
                src="https://ygoprodeck.com/wp-content/uploads/2017/01/level.png"
                alt="x"
              />
              <img
                src="https://ygoprodeck.com/wp-content/uploads/2017/01/level.png"
                alt="x"
              />
              <img
                src="https://ygoprodeck.com/wp-content/uploads/2017/01/level.png"
                alt="x"
              />
              <img
                height="1vw"
                src="https://ygoprodeck.com/wp-content/uploads/2017/01/level.png"
                alt="x"
              />
            </div>
            <div class="image">
              <img
                height="100%"
                width="100%"
                src="https://uploads2.yugioh.com/card_images/257/detail/Dark-Magician.jpg?1375127294"
              />
            </div>
            <div class="data">
              <div class="description">
                <h6>[ SPELLCASTER / NORMAL]</h6>
                <p>The ultimate wizard in terms of attack and defense.</p>
              </div>
              <div class="stats">
                <span>ATK /2500</span>
                <span>DEF /2500</span>
              </div>
            </div>
          </div>
        </div>
        <div class="card col-2 row-1"></div>
        <div class="card col-2 row-2"></div>
        <div class="card col-2 row-3"></div>
      </section>
      <section class="col-1 row-2 grid-2-3">
        <div class="card col-2 row-1"></div>
        <div class="card col-2 row-2"></div>
        <div class="card col-2 row-3"></div>
      </section>
    </section>
    <section class="grid-1-2 col-2 center">
      <section class="col-1 row-start-2 row-end-3 sub-center">
        <div class="card col-1 row-start-2 row-end-4"></div>
        <div class="card col-2 row-start-2 row-end-4"></div>
        <div class="card col-3 row-start-2 row-end-4"></div>
        <div class="card col-4 row-start-2 row-end-4"></div>
        <div class="card col-5 row-start-2 row-end-4"></div>
        <div class="card col-1 row-start-4 row-end-6"></div>
        <div class="card col-2 row-start-4 row-end-6"></div>
        <div class="card col-3 row-start-4 row-end-6"></div>
        <div class="card col-4 row-start-4 row-end-6"></div>
        <div class="card col-5 row-start-4 row-end-6"></div>
      </section>
      <section class="col-1 row-start-4 row-end-5 sub-center">
        <div class="card col-1 row-start-2 row-end-4"></div>
        <div class="card col-2 row-start-2 row-end-4"></div>
        <div class="card col-3 row-start-2 row-end-4"></div>
        <div class="card col-4 row-start-2 row-end-4"></div>
        <div class="card col-5 row-start-2 row-end-4"></div>
        <div class="card col-1 row-start-4 row-end-6"></div>
        <div class="card col-2 row-start-4 row-end-6"></div>
        <div class="card col-3 row-start-4 row-end-6"></div>
        <div class="card col-4 row-start-4 row-end-6"></div>
        <div class="card col-5 row-start-4 row-end-6"></div>
      </section>
    </section>
    <section class="grid-1-2 col-3">
      <section class="col-1 row-1 grid-2-3">
        <div class="card col-1 row-1"></div>
        <div class="card col-1 row-2"></div>
        <div class="card col-1 row-3"></div>
      </section>
      <section class="col-1 row-2 grid-2-3">
        <div class="card col-2 row-1"></div>
        <div class="card col-1 row-1"></div>
        <div class="card col-1 row-2"></div>
        <div class="card col-1 row-3"></div>
      </section>
    </section>
    <script>
      const card = document.getElementsByClassName("card-yugi")[0];
      console.log(card);
      const boxes = document.getElementsByClassName("card");
      for (let i = 0; i < boxes.length; i++) {
        const clone = document.importNode(card, true);
        boxes[i].appendChild(clone);
      }
      card.remove();
    </script>
  </body>
</html>
