<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="card.css">
    <title>Cards</title>
</head>
<body>
    <section class="col-1 grid-1-2">
        <section class="col-1 row-1 grid-2-3">
            <div class="card col-1 row-3">
                <div class="card-yugi">
                    <div class="title">
                        <p>Dark Magician</p>
                        <img height="20px" src="https://images.ygoprodeck.com/images/cards/DARK.jpg" alt="x">
                    </div>
                    <div class="stars">
                        <img height="10px" src="https://ygoprodeck.com/wp-content/uploads/2017/01/level.png" alt="x">
                        <img height="10px" src="https://ygoprodeck.com/wp-content/uploads/2017/01/level.png" alt="x">
                        <img height="10px" src="https://ygoprodeck.com/wp-content/uploads/2017/01/level.png" alt="x">
                        <img height="10px" src="https://ygoprodeck.com/wp-content/uploads/2017/01/level.png" alt="x">
                        <img height="10px" src="https://ygoprodeck.com/wp-content/uploads/2017/01/level.png" alt="x">
                        <img height="10px" src="https://ygoprodeck.com/wp-content/uploads/2017/01/level.png" alt="x">
                        <img height="10px" src="https://ygoprodeck.com/wp-content/uploads/2017/01/level.png" alt="x">
                    </div>
                    <div class="image">
                        <img height="100%" width="100%" src="https://uploads2.yugioh.com/card_images/257/detail/Dark-Magician.jpg?1375127294"/>
                    </div>
                    <div class="data">
                        <div class="description">
                            <h6>[ SPELLCASTER / NORMAL]</h6>
                            <p>The ultimate wizard in terms of attack and defense.</p>
                        </div>
                        <div class="stats">
                            <span>ATK /2500</span>
                            <span>DEF /2500</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card col-2 row-1"></div>
            <div class="card col-2 row-2"></div>
            <div class="card col-2 row-3"></div>
        </section>
        <section class=" col-1 row-2 grid-2-3">
            <div class="card col-2 row-1"></div>
            <div class="card col-2 row-2"></div>
            <div class="card col-2 row-3"></div>
        </section>
    </section>
     <section class="grid-1-2 col-2">
        <section class="col-1 row-1 grid-5-6">
            <div class="card col-1 row-start-2 row-end-4"></div>
            <div class="card col-2 row-start-2 row-end-4"></div>
            <div class="card col-3 row-start-2 row-end-4"></div>
            <div class="card col-4 row-start-2 row-end-4"></div>
            <div class="card col-5 row-start-2 row-end-4"></div>
            <div class="card col-1 row-start-4 row-end-6"></div>
            <div class="card col-2 row-start-4 row-end-6"></div>
            <div class="card col-3 row-start-4 row-end-6"></div>
            <div class="card col-4 row-start-4 row-end-6"></div>
            <div class="card col-5 row-start-4 row-end-6"></div>
        </section>
        <section class="col-1 row-2 grid-5-6">
            <div class="card col-1 row-start-2 row-end-4"></div>
            <div class="card col-2 row-start-2 row-end-4"></div>
            <div class="card col-3 row-start-2 row-end-4"></div>
            <div class="card col-4 row-start-2 row-end-4"></div>
            <div class="card col-5 row-start-2 row-end-4"></div>
            <div class="card col-1 row-start-4 row-end-6"></div>
            <div class="card col-2 row-start-4 row-end-6"></div>
            <div class="card col-3 row-start-4 row-end-6"></div>
            <div class="card col-4 row-start-4 row-end-6"></div>
            <div class="card col-5 row-start-4 row-end-6"></div>
        </section>
    </section>
     <section class="grid-1-2 col-3">
        <section class="col-1 row-1 grid-2-3">
            <div class="card col-1 row-1"></div>
            <div class="card col-1 row-2"></div>
            <div class="card col-1 row-3"></div>
        </section>
        <section class=" col-1 row-2 grid-2-3">
            <div class="card col-2 row-1"></div>
            <div class="card col-1 row-1"></div>
            <div class="card col-1 row-2"></div>
            <div class="card col-1 row-3"></div>
        </section>
    </section>
</body>
</html>
